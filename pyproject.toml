[project]
name = "news-collect"
version = "0.1.0"
description = "Multi-source financial news crawler powered by Scrapling"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "gx360" }
]
dependencies = [
    "scrapling[fetchers,schedule]>=0.2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "schedule>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
news-collect = "news_collect.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["news_collect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
