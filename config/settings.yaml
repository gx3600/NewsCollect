# Global settings for NewsCollect

# Database path
db_path: "data/news.db"

# Concurrency & rate limiting
concurrency: 5
timeout: 30
download_delay: 1.0

# Data retention (days)
retention_days: 90

# Logging
log_level: "INFO"

# Proxies (optional, one per line)
proxies: []
proxy:
  http: "http://127.0.0.1:7892"
  https: "http://127.0.0.1:7892"

# User agent (default browser impersonation handles this, fallback only)
user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
